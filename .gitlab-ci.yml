# Harpocrates is ARCHIVED and unsupported — see README.md.
#
# CI is intentionally disabled. The `workflow` rule below blocks pipeline
# creation for every source (push, merge request, schedule, web, API), so no
# job in this file ever runs. The placeholder job exists only because GitLab
# rejects a `.gitlab-ci.yml` that contains no visible jobs.
#
# The previous pipeline (pr-check frontend/rust/secrets, tag, discord-notify,
# renovate, branch-cleanup, bump-version) is preserved in git history at the
# parent of the commit that archived the project. To revive CI, restore this
# file from there and re-enable CI/CD in Settings > General > Visibility.
workflow:
  rules:
    - when: never

archived-placeholder:
  stage: build
  script:
    - echo "Harpocrates is archived; CI is disabled."
